<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Vitrina — Server sinovi</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 30px auto; padding: 0 20px; background: #16233A; color: #EDE6D6; }
  h1 { font-size: 22px; }
  label { display: block; margin: 14px 0 5px; font-size: 13px; color: #B9C2D0; }
  input, textarea { width: 100%; padding: 9px; border-radius: 4px; border: 1px solid #3d4d6b; background: #1e2f4d; color: white; box-sizing: border-box; }
  button { margin-top: 20px; width: 100%; padding: 12px; background: #B5533C; color: white; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
  button:disabled { background: #5B6B7A; }
  #result { margin-top: 20px; padding: 14px; background: #1e2f4d; border-radius: 4px; white-space: pre-wrap; font-size: 13px; word-break: break-all; }
  a { color: #9fd; }
</style>
</head>
<body>
  <h1>🏡 Vitrina — Server sinovi</h1>
  <p style="color:#B9C2D0; font-size:14px;">Bu sahifa to'g'ridan-to'g'ri serveringizda ishlaydi. Instagram tokeni bo'lmagani uchun hozircha faqat video yasalgani tekshiriladi.</p>

  <label>Admin Secret (Render'da qo'ygan maxfiy so'zingiz)</label>
  <input id="adminSecret" placeholder="MaxfiySoz2026">

  <label>Rasmlar (2-3 tasi yetarli)</label>
  <input type="file" id="images" accept="image/*" multiple>

  <label>Uy turi</label>
  <input id="uyTuri" value="Hovli uy">

  <label>Manzil</label>
  <input id="manzil" value="Yunusobod tumani">

  <label>Narxi</label>
  <input id="narx" value="$255000">

  <label>Xonalar</label>
  <input id="xonalar" value="6">

  <label>Maydon (m²)</label>
  <input id="maydon" value="240">

  <label>Xususiyatlari</label>
  <textarea id="xususiyat">Yaxshi mahallada, yevroremont, yashil hudud</textarea>

  <button id="sendBtn">Yuborish va sinash</button>

  <div id="result" style="display:none;"></div>

<script>
document.getElementById('sendBtn').onclick = async () => {
  const btn = document.getElementById('sendBtn');
  const result = document.getElementById('result');
  const baseUrl = window.location.origin;
  const adminSecret = document.getElementById('adminSecret').value.trim();
  const images = document.getElementById('images').files;

  if (!adminSecret) { alert('Admin Secret kiriting!'); return; }
  if (images.length === 0) { alert('Kamida bitta rasm tanlang!'); return; }

  const formData = new FormData();
  for (const file of images) formData.append('images', file);
  formData.append('uyTuri', document.getElementById('uyTuri').value);
  formData.append('manzil', document.getElementById('manzil').value);
  formData.append('narx', document.getElementById('narx').value);
  formData.append('xonalar', document.getElementById('xonalar').value);
  formData.append('maydon', document.getElementById('maydon').value);
  formData.append('xususiyat', document.getElementById('xususiyat').value);
  formData.append('scheduledFor', new Date(Date.now() + 86400000).toISOString());

  btn.disabled = true;
  btn.textContent = 'Video yasalmoqda... (1-2 daqiqa kutishingiz mumkin)';
  result.style.display = 'block';
  result.textContent = 'Yuborilmoqda...';

  try {
    const res = await fetch(`${baseUrl}/api/listings`, {
      method: 'POST',
      headers: { 'x-admin-secret': adminSecret },
      body: formData
    });
    const data = await res.json();
    if (res.ok) {
      result.innerHTML = '✅ MUVAFFAQIYATLI!\n\n' + JSON.stringify(data, null, 2) + '\n\nVideoni ko\'rish: <a href="' + data.videoUrl + '" target="_blank">' + data.videoUrl + '</a>';
    } else {
      result.textContent = '❌ XATOLIK:\n\n' + JSON.stringify(data, null, 2);
    }
  } catch (err) {
    result.textContent = '❌ Ulanishda xatolik: ' + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Yuborish va sinash';
  }
};
</script>
</body>
</html>
